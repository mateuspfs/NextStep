name: Deploy Frontend to AWS S3

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Resolve API URL
        id: api_url
        env:
          VITE_API_URL_SECRET: ${{ secrets.VITE_API_URL }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          URL="${VITE_API_URL_SECRET%/}"
          invalid() {
            [ -z "$1" ] || [[ "$1" == /* ]] || [[ "$1" == *s3-website* ]] || [[ "$1" == *cloudfront.net* ]] || [[ "$1" == *s3.amazonaws.com* ]] || [[ "$1" == *localhost* ]]
          }
          if invalid "$URL"; then
            if [ -z "$EC2_HOST" ]; then
              echo "::error::Cadastre o secret EC2_HOST (IP público da instância da API) ou VITE_API_URL no formato http://IP-DA-EC2/api"
              exit 1
            fi
            URL="http://${EC2_HOST}/api"
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Frontend será apontado para: $URL"

      - name: Build project
        run: npm run build
        env:
          VITE_API_URL: ${{ steps.api_url.outputs.url }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to S3
        run: aws s3 sync dist/ s3://${{ secrets.S3_BUCKET_NAME }} --delete

      - name: Invalidate CloudFront cache (Optional)
        if: env.CLOUDFRONT_DISTRIBUTION_ID != ''
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
