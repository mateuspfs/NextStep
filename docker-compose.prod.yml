services:
  api:
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/nextstep-api:latest
    container_name: nextstep-api
    restart: always
    ports:
      - "80:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_URLS=http://+:8080
      # String de conexão apontando para o RDS MySQL gerenciado
      - ConnectionStrings__DefaultConnection=Server=${DB_HOST};Database=${DB_NAME:-nextstep};User=${DB_USER:-admin};Password=${DB_PASSWORD};Port=${DB_PORT:-3306};
      - JwtSettings__SecretKey=${JWT_SECRET_KEY}
      - JwtSettings__Issuer=${JWT_ISSUER:-NextStep}
      - JwtSettings__Audience=${JWT_AUDIENCE:-NextStep}
      - JwtSettings__ExpiryMinutes=${JWT_EXPIRY_MINUTES:-60}
      - AWS__BucketName=${AWS_S3_BUCKET_NAME:-nextstep-frontend-prod-cda235a3}
      - AWS__Region=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME:-nextstep-frontend-prod-cda235a3}
